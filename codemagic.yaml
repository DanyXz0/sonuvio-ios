# Compila Sonuvio para iPhone en un Mac de Codemagic (plan gratuito: unos 500 minutos al mes en Mac mini M2)
# y deja Sonuvio-iOS.ipa sin firmar para instalarlo con Sideloadly. Se lanza desde codemagic.io → Start new build.
workflows:
  sonuvio-ios:
    name: Sonuvio para iPhone
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Generar el proyecto de Xcode
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Compilar sin firmar
        script: |
          set -o pipefail
          xcodebuild \
            -project Sonuvio.xcodeproj \
            -scheme Sonuvio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*Sonuvio/|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Sonuvio.app
      - name: Empaquetar el .ipa
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sonuvio.app Payload/
          zip -qry Sonuvio-iOS.ipa Payload
    artifacts:
      - Sonuvio-iOS.ipa
      - build.log
